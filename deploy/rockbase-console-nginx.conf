# Example only. Install after supplying a real certificate and hostname.
server {
    listen 443 ssl;
    server_name console.example.invalid;

    ssl_certificate /etc/letsencrypt/live/console.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.invalid/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
