# rockbase-mailkit 配置模板
# 复制为 config.toml 并替换全部 PLACEHOLDER。config.toml 不进版本库。

[smtp]
# 公司服务器 SMTP（S2 发信）
host = "SMTP_HOST_PLACEHOLDER"          ; e.g. mail.yourcompany.com
port = 587
username = "SMTP_USER_PLACEHOLDER"      ; e.g. partnerships@yourcompany.com
password = "SMTP_PASS_PLACEHOLDER"
use_tls = true
from_addr = "partnerships@yourcompany.example"
from_name = "YourCompany Partnerships"

[receiver]
# 收信端：路线A = https://mailgofer.<你的域>（Cloudflare 版）
#         路线B = http://127.0.0.1:8788（公司服务器自建 receiver）
base_url = "http://127.0.0.1:8788"
api_key = "RECEIVER_API_KEY_PLACEHOLDER"
# catch-all 收信域（回复落在这里）
domain = "yourcompany.example"
# 轮询的本方地址列表；留空则用 smtp.from_addr
watch_addrs = ""

[send]
# 节奏：默认对齐 Rockbase SOP「每 2 小时 3–5 条」
max_per_window = 4
window_minutes = 120
daily_cap = 30
opt_out_line = "If you'd rather not hear from us, just reply 'unsubscribe' and we won't email you again."
allow_links_first_touch = false

[paths]
# 过程文件目录（manifest / replies 导出）
workdir = "workbench"
