[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rockbase-skills"
version = "2.0.0"
description = "Portable source release for Rockbase workflow skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "langdetect>=1.0.9,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
  "Pillow>=10,<12",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
gmail = [
  "google-api-python-client>=2.120,<3",
  "google-auth>=2.28,<3",
  "google-auth-httplib2>=0.2,<1",
  "httplib2>=0.22,<1",
]
browser = ["playwright>=1.42,<2"]
ocr = ["opencv-python>=4.9,<5"]
social = [
  "deep-translator>=1.11,<2",
  "instaloader>=4.11,<5",
  "twscrape>=0.15,<1",
]
llm = ["openai>=1,<4"]

[tool.setuptools.packages.find]
where = [
  ".",
  "skills/S1-inbox-kol-fuzzy-discovery-instagram-skill/src",
  "skills/S1-inbox-kol-fuzzy-discovery-tiktok-skill/src",
  "skills/S1-inbox-kol-fuzzy-discovery-x-skill/src",
  "skills/S1-inbox-kol-fuzzy-discovery-youtube-skill/src",
]
include = [
  "rockbase*",
  "instagram_kol_discovery*",
  "tiktok_kol_discovery*",
  "x_kol_discovery*",
  "youtube_kol_discovery*",
]
